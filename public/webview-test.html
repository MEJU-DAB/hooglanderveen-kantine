<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebView CSS Slideshow Test</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #1560b8;
    --yellow: #ffd600;
    --bg: #0a1628;
    --text: #e8edf5;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
  }

  #slideshow {
    position: fixed;
    inset: 0;
    bottom: 60px; /* ruimte voor debugbalk */
  }

  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 48px;
    opacity: 0;
    transform: translateY(14px);
    border-left: 8px solid var(--yellow);
  }

  .slide-num {
    font-size: 0.85rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--yellow);
    margin-bottom: 16px;
  }

  .slide-title {
    font-size: clamp(2rem, 5vw, 4rem);
    font-weight: 800;
    line-height: 1.1;
    color: #fff;
    margin-bottom: 24px;
  }

  .slide-body {
    font-size: clamp(1rem, 2vw, 1.5rem);
    line-height: 1.6;
    color: var(--text);
    max-width: 70ch;
  }

  /* Debugbalk */
  #debug {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 60px;
    background: rgba(0,0,0,0.85);
    border-top: 2px solid var(--yellow);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 32px;
    font-size: 0.8rem;
    font-family: 'Consolas', monospace;
    color: #aaa;
    z-index: 100;
  }

  #debug .label { color: var(--yellow); font-weight: bold; }
  #debug .ok   { color: #4ade80; }
  #debug .warn { color: #f87171; }
  #debug .val  { color: #fff; font-weight: bold; }
</style>
</head>
<body>

<div id="slideshow"></div>

<div id="debug">
  <span><span class="label">CSS-animatie</span> <span class="ok">actief</span></span>
  <span><span class="label">Klok:</span> <span class="val" id="d-clock">--:--:--</span></span>
  <span><span class="label">setInterval ticks:</span> <span class="val" id="d-interval">0</span></span>
  <span><span class="label">rAF ticks:</span> <span class="val" id="d-raf">0</span></span>
  <span><span class="label">Cyclus:</span> <span class="val" id="d-cycle">--</span>s</span>
  <span id="d-throttle"></span>
</div>

<script>
// ── Testdata ──────────────────────────────────────────────────────────────────
const slides = [
  {
    id: 1,
    duration: 5,
    num: 'Slide 1 van 3',
    title: 'CSS-animaties op de compositor thread',
    body: 'Deze slide is zichtbaar gedurende 5 seconden. De overgang wordt volledig aangestuurd door @keyframes CSS — geen JavaScript-timer nodig. Als de JS-tellers hieronder achterlopen maar de slides toch wisselen, is de aanpak geslaagd.',
  },
  {
    id: 2,
    duration: 8,
    num: 'Slide 2 van 3',
    title: 'SetInterval vs requestAnimationFrame',
    body: 'Deze slide duurt 8 seconden. Let op de tellers onderaan: setInterval en rAF kunnen worden gethrottled door de embedded browser. De CSS-animatie draait daarentegen op de GPU-compositor en is immuun voor JS-throttling.',
  },
  {
    id: 3,
    duration: 6,
    num: 'Slide 3 van 3',
    title: 'WebView compatibiliteit test',
    body: 'Laatste slide — 6 seconden. Na deze slide herstart de cyclus naadloos bij slide 1. Als alle drie slides door zijn gegaan zonder JS-timmers te vereisen, werkt de refactor correct in de Sportlink mediaplayer.',
  },
];

// ── buildKeyframes (zelfde logica als Slideshow.tsx) ──────────────────────────
function buildKeyframes(slides) {
  if (slides.length === 0) return '';
  if (slides.length === 1) {
    return '@keyframes slide-anim-0{0%,100%{opacity:1;transform:translateY(0)}}\n';
  }

  const totalS = slides.reduce((sum, s) => sum + s.duration, 0);
  const fadePct = (0.55 / totalS) * 100;

  const h = 'opacity:0;transform:translateY(14px)';
  const v = 'opacity:1;transform:translateY(0)';

  let css = '';
  let cumulative = 0;

  for (let i = 0; i < slides.length; i++) {
    const dur = slides[i].duration;
    const startPct = (cumulative / totalS) * 100;
    const endPct   = ((cumulative + dur) / totalS) * 100;
    const mid      = (startPct + endPct) / 2;

    const fadeInEnd    = Math.min(startPct + fadePct, mid);
    const fadeOutStart = Math.max(endPct - fadePct, mid);

    css += `@keyframes slide-anim-${i}{`;

    if (i === 0) {
      css += `0%{${v}}`;
    } else {
      css += `0%{${h}}`;
      if (startPct > 0.001) css += `${startPct.toFixed(3)}%{${h}}`;
      css += `${fadeInEnd.toFixed(3)}%{${v}}`;
    }

    if (fadeOutStart > fadeInEnd + 0.01) {
      css += `${fadeOutStart.toFixed(3)}%{${v}}`;
    }

    const endToken = endPct < 99.999 ? `${endPct.toFixed(3)}%` : '100%';
    css += `${endToken}{${h}}`;
    if (endPct < 99.999) css += `100%{${h}}`;

    css += `}\n`;
    cumulative += dur;
  }

  return css;
}

// ── Render slides in DOM ───────────────────────────────────────────────────────
const totalS = slides.reduce((sum, s) => sum + s.duration, 0);
document.getElementById('d-cycle').textContent = totalS;

const css = buildKeyframes(slides);
const styleEl = document.createElement('style');
styleEl.id = 'slide-keyframes';
styleEl.textContent = css;
document.head.appendChild(styleEl);

const container = document.getElementById('slideshow');
slides.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'slide';
  el.innerHTML = `
    <div class="slide-num">${s.num}</div>
    <div class="slide-title">${s.title}</div>
    <div class="slide-body">${s.body}</div>
  `;
  el.style.cssText = [
    `animation-name: slide-anim-${i}`,
    `animation-duration: ${totalS}s`,
    `animation-timing-function: linear`,
    `animation-iteration-count: infinite`,
    `animation-fill-mode: both`,
  ].join(';');
  container.appendChild(el);
});

// ── Debug: klok via setInterval ────────────────────────────────────────────────
let intervalTicks = 0;
const clockEl    = document.getElementById('d-clock');
const intervalEl = document.getElementById('d-interval');
const throttleEl = document.getElementById('d-throttle');

const startTime = Date.now();

setInterval(() => {
  intervalTicks++;
  const elapsed = (Date.now() - startTime) / 1000;
  const expected = intervalTicks; // 1 tick per seconde verwacht
  const drift = elapsed - expected;

  clockEl.textContent = new Date().toLocaleTimeString('nl-NL');
  intervalEl.textContent = intervalTicks;

  // Waarschuw als drift > 2s (JS gethrottled)
  if (drift > 2) {
    throttleEl.innerHTML = `<span class="warn">⚠ JS throttled! drift: +${drift.toFixed(1)}s</span>`;
  } else {
    throttleEl.innerHTML = `<span class="ok">JS normaal (drift: ${drift > 0 ? '+' : ''}${drift.toFixed(1)}s)</span>`;
  }
}, 1000);

// ── Debug: rAF-teller ─────────────────────────────────────────────────────────
let rafTicks = 0;
let lastRafTime = performance.now();
const rafEl = document.getElementById('d-raf');

function rafLoop(now) {
  // Tel seconde-overgangen
  if (now - lastRafTime >= 1000) {
    rafTicks++;
    lastRafTime += 1000;
    rafEl.textContent = rafTicks;
  }
  requestAnimationFrame(rafLoop);
}
requestAnimationFrame(rafLoop);
</script>
</body>
</html>
