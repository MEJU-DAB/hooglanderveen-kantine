<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VV Hooglanderveen — WebView test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a1628;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #132240;
      border: 2px solid #e8b84b;
      border-radius: 16px;
      padding: 48px 56px;
      max-width: 640px;
      width: 90%;
    }
    .badge {
      display: inline-block;
      background: #1db954;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.08em;
      padding: 4px 14px;
      border-radius: 99px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 28px;
      color: #e8b84b;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    p {
      font-size: 16px;
      color: #a0b4cc;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .status {
      background: #0d1f36;
      border-radius: 8px;
      padding: 16px 20px;
      font-size: 14px;
      color: #7fa8cc;
      text-align: left;
    }
    .status span { color: #e8b84b; font-weight: bold; }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #1db954;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }
    .clock {
      font-size: 36px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge"><span class="dot"></span>WebView Compatibility Test</div>
    <div class="clock" id="clock">--:--</div>
    <h1>VV Hooglanderveen<br>Nieuwsscherm werkt</h1>
    <p>
      Als je deze pagina ziet, laadt de WebView statische HTML correct.<br>
      Dit is een <strong>puur HTML/CSS pagina</strong> zonder JavaScript-frameworks.
    </p>
    <div class="status">
      <div><span>URL:</span> <span id="url">laden...</span></div>
      <div style="margin-top:8px"><span>User-Agent:</span> <span id="ua" style="word-break:break-all;">laden...</span></div>
      <div style="margin-top:8px"><span>Tijdstip:</span> <span id="ts">laden...</span></div>
      <div style="margin-top:8px"><span>setInterval:</span> <span id="ticks">0 ticks</span></div>
    </div>
  </div>

  <script>
    document.getElementById('url').textContent = window.location.href;
    document.getElementById('ua').textContent  = navigator.userAgent;
    document.getElementById('ts').textContent  = new Date().toLocaleString('nl-NL');

    function pad(n) { return n < 10 ? '0' + n : String(n); }
    function updateClock() {
      var d = new Date();
      document.getElementById('clock').textContent =
        pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }
    updateClock();

    var ticks = 0;
    setInterval(function() {
      ticks++;
      document.getElementById('ticks').textContent = ticks + ' ticks';
      updateClock();
    }, 1000);
  </script>
</body>
</html>
